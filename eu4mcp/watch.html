<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12100c">
<title>Claude plays EU4</title>
<style>
  :root {
    /* surfaces */
    --bg: #12100c; --panel: #1a1611; --card: #211c15; --line: #3b3226; --line-soft: #2c251c; --black: #000;
    /* text (all >= 7:1 on their surfaces) */
    --ink: #efe6d2; --dim: #b3a68e; --gold: #dcb35e; --on-gold: #1a140a;
    /* status */
    --ok: #7fb069; --bad: #d9705f;
    /* entry kinds: background, left edge, label colour, text colour */
    --say-bg: #2d2515;   --say-edge: #dcb35e;   --say-label: #dcb35e;   --say-ink: #f4ead4;
    --story-bg: #1c1a14; --story-edge: #86a36f; --story-label: #a3c18b; --story-ink: var(--ink);
    --ok-bg: #172319;    --ok-edge: #7fbf86;    --ok-label: #8fd096;    --ok-ink: #b9dcbc;
    --bad-bg: #2a1714;   --bad-edge: #e0877a;   --bad-label: #f0a597;   --bad-ink: #f3c4ba;
    --read-bg: #161a1d;  --read-edge: #6f93ad;  --read-label: #8fb0c8;  --read-ink: #aebdc7;
    --note-bg: #211a28;  --note-edge: #a98fc9;  --note-label: #b9a0d6;  --note-ink: #d3c6e0;
    --scroll: #4a3e2d;
    --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
    --gut: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 Georgia, "Times New Roman", serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  .wrap { display: grid; grid-template-columns: minmax(0, 133.333vh) minmax(380px, 1fr); height: 100vh; background: var(--black); }
  .game { display: flex; flex-direction: column; min-width: 0; background: var(--black); }
  .game iframe, .game video { flex: 1; width: 100%; min-height: 0; border: 0; background: var(--black); }
  .game video { object-fit: contain; pointer-events: none; }
  .game [hidden] { display: none; }
  .side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); position: relative; }
  * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  header { padding: 9px var(--gut) 8px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; font-weight: normal; color: var(--gold); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 1px; font-family: system-ui, sans-serif; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.run { background: var(--ok); } .dot.pause { background: var(--gold); }
  .stats { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 7px; font-variant-numeric: tabular-nums; }
  .stats:empty { display: none; }
  #statsd .stats { margin: 6px 0 4px; }
  .sum { margin-left: 10px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  details[open] > summary > .sum { display: none; }
  .chips { display: none; }
  .stat { grid-column: span 3; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
  .stat:nth-child(n+5) { grid-column: span 4; }
  .stat b { display: block; font-size: 15px; font-weight: normal; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  .stat span small { font-size: inherit; }
  .stat span { display: block; color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-family: system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details { border-bottom: 1px solid var(--line); padding: 5px var(--gut); }
  summary { cursor: pointer; color: var(--gold); font-size: 13px; font-family: system-ui, sans-serif; }
  details pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 3px; font: 13.5px/1.45 Georgia, serif; color: var(--ink); max-height: 18vh; overflow: auto; }
  details pre.muted { color: var(--dim); font-style: italic; }

  .feedbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px var(--gut); border-bottom: 1px solid var(--line-soft); font: 12px system-ui, sans-serif; color: var(--dim); }
  .feedbar .ttl { letter-spacing: .08em; text-transform: uppercase; font-weight: 600; font-size: 11px; }
  .opt { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink); user-select: none; -webkit-user-select: none; min-height: 24px; }
  .opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--gold); cursor: pointer; }

  .feedwrap { flex: 1; min-height: 0; position: relative; display: flex; }
  #feed { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 8px var(--gut) 16px; }
  .e { margin: 0 0 8px; padding: 8px 11px; border-radius: 6px; border-left: 3px solid var(--line); background: var(--card); color: var(--ink); overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.5; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .e .who { font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
  .e.say   { background: var(--say-bg);   border-left-color: var(--say-edge);   color: var(--say-ink); font-style: italic; }
  .e.say .who { color: var(--say-label); font-style: normal; }
  .e.story { background: var(--story-bg); border-left-color: var(--story-edge); color: var(--story-ink); }
  .e.story .who { color: var(--story-label); }
  .e.act.ok  { background: var(--ok-bg);  border-left-color: var(--ok-edge);  color: var(--ok-ink); }
  .e.act.ok .who { color: var(--ok-label); }
  .e.act.bad { background: var(--bad-bg); border-left-color: var(--bad-edge); color: var(--bad-ink); }
  .e.act.bad .who { color: var(--bad-label); }
  .e.read { background: var(--read-bg); border-left-color: var(--read-edge); color: var(--read-ink); }
  .e.read .who { color: var(--read-label); }
  .e.note { background: var(--note-bg); border-left-color: var(--note-edge); color: var(--note-ink); }
  .e.note .who { color: var(--note-label); }
  .day { display: flex; align-items: center; gap: 10px; color: var(--gold); font: 600 11.5px system-ui, sans-serif; letter-spacing: .1em; margin: 14px 0 8px; animation: in .35s ease-out; }
  .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; font-size: 16px; font-style: italic; }
  #jump { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--on-gold); border: 0; border-radius: 16px; padding: 5px 14px; font: 600 12.5px system-ui, sans-serif; cursor: pointer; box-shadow: 0 2px 8px #0009; }
  #jump[hidden] { display: none; }

  /* Compact: more entries per screen, still 12px. The speaker label runs inline with the text. */
  body.compact #feed { padding: 5px var(--gut) 10px; }
  body.compact .e { margin: 0 0 3px; padding: 3px 8px; border-radius: 4px; border-left-width: 2px; font-size: 12px; line-height: 1.35; }
  body.compact .e .who { display: inline; margin: 0 6px 0 0; font-size: 9.5px; letter-spacing: .05em; }
  body.compact .e .who + div { display: inline; }
  body.compact .day { margin: 8px 0 4px; font-size: 10px; gap: 8px; }
  body.compact .empty { font-size: 13px; margin-top: 20px; }

  /* Phone (narrow, or landscape and short): the three folds become chips, one open at a time, folded by default. */
  @media (max-width: 800px), (max-height: 500px) and (orientation: landscape) {
    .chips { display: flex; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
    .chip { flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); color: var(--gold); font: 13px system-ui, sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .chip[hidden] { display: none; }
    .chip b { font-weight: 600; }
    .chip.stat-chip { flex: 1 1 0; }
    .chip .csum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
    .chip[aria-expanded="true"] { background: var(--say-bg); border-color: var(--gold); }
    .chip[aria-expanded="true"] .csum { display: none; }
    details > summary { display: none; }
    details:not([open]) { display: none; }
    details { padding-top: 6px; padding-bottom: 6px; }
    details pre { max-height: 24vh; font-size: 14px; margin: 0; }
    #statsd .stats { margin: 0; }
    .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feedbar { min-height: 40px; padding-top: 0; padding-bottom: 0; font-size: 13px; }
    .opt { min-height: 40px; padding-left: 8px; gap: 9px; font-size: 14px; }
    .opt input { width: 22px; height: 22px; }
    #jump { min-height: 40px; padding: 0 18px; border-radius: 20px; font-size: 14px; bottom: calc(10px + var(--safe-b)); }
    .e { font-size: 15px; line-height: 1.45; }
    body.compact .e { font-size: 13px; line-height: 1.4; }
    body.compact .e .who { font-size: 10px; }
  }
  /* Narrow (portrait phone): video on top, capped so the log keeps at least half the screen; the page itself never scrolls. */
  @media (max-width: 800px) {
    html, body { overflow: hidden; }
    .wrap { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .game { flex: none; width: 100%; height: min(75vw, 34vh); padding-top: var(--safe-t); background: var(--black); }
    @supports (height: 1dvh) { .game { height: min(75vw, 34dvh); } }
    .game video, .game iframe { pointer-events: none; }
    .side { flex: 1; border-left: 0; border-top: 1px solid var(--line); }
    :root { --gut: max(16px, var(--safe-l)); }
    header, details, .chips, .feedbar, #feed { padding-left: max(16px, var(--safe-l)); padding-right: max(16px, var(--safe-r)); }
    #feed { padding-bottom: calc(16px + var(--safe-b)); }
    header { padding-top: 6px; padding-bottom: 4px; border-bottom: 0; }
    h1 { font-size: 15px; }
    .sub { font-size: 12.5px; margin-top: 0; }
    .stat { padding: 2px 6px; }
    .stat b { font-size: 14px; line-height: 1.3; }
    .stat span { font-size: 10px; letter-spacing: .03em; }
  }
  /* Short landscape: video on the left sized by height, log beside it. */
  @media (max-height: 500px) and (orientation: landscape) {
    .wrap { display: grid; grid-template-columns: minmax(0, 133.333vh) minmax(0, 1fr); grid-template-rows: 100%; height: 100vh; height: 100dvh; }
    .game { height: auto; width: auto; padding-top: 0; padding-left: var(--safe-l); }
    .side { border-left: 1px solid var(--line); border-top: 0; padding-right: var(--safe-r); }
    :root { --gut: 12px; }
    header, details, .chips, .feedbar, #feed { padding-left: 12px; padding-right: 12px; }
    #feed { padding-bottom: 12px; }
    header { padding-top: calc(4px + var(--safe-t)); padding-bottom: 4px; border-bottom: 0; }
    h1 { font-size: 15px; }
    .sub { font-size: 12px; }
    .stats { display: flex; flex-wrap: wrap; }
    .stat, .stat:nth-child(n+5) { flex: 1 1 auto; grid-column: auto; padding: 2px 5px; }
    .stat span { font-size: 9.5px; letter-spacing: .02em; overflow: visible; }
    .stat span small { display: none; }
    .chips { padding-top: 4px; padding-bottom: 4px; }
    .chip { padding: 0 11px; }
    .feedbar, .opt { min-height: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="game"><video id="vid" muted autoplay playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noplaybackrate" tabindex="-1"></video><iframe id="vnc" title="Live game" hidden></iframe></div>
  <div class="side">
    <header>
      <h1>Claude plays Europa Universalis IV</h1>
      <div class="sub"><span class="dot" id="dot"></span><span id="line">connecting…</span></div>
    </header>
    <nav class="chips" id="chips" aria-label="Panels">
      <button type="button" class="chip stat-chip" data-fold="statsd" aria-expanded="false"><b>Stats</b><span class="csum" id="chipsum"></span></button>
      <button type="button" class="chip" data-fold="plan" aria-expanded="false"><b>Plan</b></button>
      <button type="button" class="chip" data-fold="rules" aria-expanded="false" hidden><b>Rules</b></button>
    </nav>
    <details id="statsd" open><summary>Game stats<span class="sum" id="statsum"></span></summary><div class="stats" id="stats"></div></details>
    <details id="plan" open><summary>Current plan</summary><pre id="plantext" class="muted">No plan written yet.</pre></details>
    <details id="rules" hidden><summary>Rules and promises</summary><pre id="rulestext"></pre></details>
    <div class="feedbar"><span class="ttl">Play log</span><label class="opt"><input type="checkbox" id="compact">Compact</label></div>
    <div class="feedwrap">
      <div id="feed"><div class="empty" id="empty">Waiting for the first move…</div></div>
      <button id="jump" hidden>Jump to latest ↓</button>
    </div>
  </div>
</div>
<script src="/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let next = 0, lastDate = null, vncSet = false;

function fmt(n, d = 0) { return n == null ? "–" : Number(n).toLocaleString("en", { maximumFractionDigits: d }); }
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function gdate(s) { if (!s) return ""; const [y, m, d] = s.split(".").map(Number); return `${d} ${MONTHS[m - 1] || m} ${y}`; }

function kfmt(n) { return n == null ? "–" : Math.abs(n) >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : fmt(n); }
function noStats() { $("stats").replaceChildren(); $("statsum").textContent = ""; $("statsd").hidden = true; syncChips(); }

async function pollState() {
  try {
    const s = await (await fetch("/api/state")).json();
    if (!vncSet && !videoOk) {
      $("vnc").hidden = false; $("vid").hidden = true;
      $("vnc").src = `http://${location.hostname}:${s.vnc_port}/vnc.html?autoconnect=true&view_only=true&resize=scale&reconnect=true&reconnect_delay=3000`;
      vncSet = true;
    }
    const dot = $("dot");
    if (!s.hook) { dot.className = "dot"; $("line").textContent = "Game not running"; noStats(); idle = "The game is not running right now."; }
    else if (!s.ingame) { dot.className = "dot pause"; $("line").textContent = "At the main menu"; noStats(); idle = "The game is at the main menu."; }
    else {
      idle = "Waiting for the first move…";
      dot.className = "dot " + (s.paused ? "pause" : "run");
      $("line").textContent = `${s.name || s.player} · ${gdate(s.date)} · ${s.paused ? "paused" : "running, speed " + s.speed}${s.buff ? " · " + s.buff : ""}`;
      const c = s.country || {};
      const cells = [["Treasury", fmt(c.treasury)], ["Manpower", fmt(c.manpower)], ["Stability", fmt(c.stability)], ["Prestige", fmt(c.prestige)],
                     ["Admin", fmt(c.adm), " power"], ["Diplo", fmt(c.dip), " power"], ["Military", fmt(c.mil), " power"]];
      $("statsd").hidden = false;
      $("statsum").textContent = `${fmt(c.treasury)} ducats · ${kfmt(c.manpower)} men · stab ${c.stability > 0 ? "+" : ""}${fmt(c.stability)}`;
      $("stats").replaceChildren(...cells.map(([k, v, more]) => {
        const d = el("div", "stat"), l = el("span", null, k);
        if (more) l.append(el("small", null, more));  // "power" is dropped where tiles are tiny
        d.append(el("b", null, v), l); return d;
      }));
    }
    updEmpty();
    const n = s.notes || {};
    const pl = $("plantext"), plan = (n.plan || "").trim();
    pl.textContent = plan || "No plan written yet."; pl.className = plan ? "" : "muted";
    const extra = [];
    if ((n.standing_rules || "").trim()) extra.push("Standing rules\n" + n.standing_rules.trim());
    if ((n.commitments || "").trim()) extra.push("Promises\n" + n.commitments.trim());
    $("rules").hidden = !extra.length; $("rulestext").textContent = extra.join("\n\n");
    syncChips();
  } catch (e) { $("dot").className = "dot"; $("line").textContent = "watch server unreachable"; }
}

// Game picture: 30 fps video; falls back to the view-only VNC picture when no stream is running.
let videoOk = false, hls = null;
async function startVideo() {
  if (videoOk) return;
  try { if (!(await fetch("/hls/live.m3u8")).ok) return; } catch (e) { return; }
  const v = $("vid");
  if (window.Hls && Hls.isSupported()) {
    hls?.destroy();
    hls = new Hls({ liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 5, maxBufferLength: 6 });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { videoOk = false; hls.destroy(); hls = null; } });
    hls.loadSource("/hls/live.m3u8"); hls.attachMedia(v);
  } else if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = "/hls/live.m3u8"; }
  else return;
  videoOk = true; v.hidden = false; $("vnc").hidden = true; $("vnc").removeAttribute("src"); vncSet = false;
  v.play().catch(() => {});
}

const ROLES = { strategist: "Claude (strategy)", clock: "Time keeper", steward: "Steward", general: "General", critic: "Reviewer" };
const SHOW = new Set(["story", "say"]);  // kinds shown in the feed; act/read/note are styled too, should they be added here
function render(e) {
  let cls = e.kind;
  if (e.kind === "act") cls += e.ok === false ? " bad" : " ok";
  const box = el("div", "e " + cls);
  if (e.kind === "say") {
    const w = String(e.who || "strategist");
    box.append(el("div", "who", ROLES[w] || (w.charAt(0).toUpperCase() + w.slice(1))));
  } else if (e.tool) box.append(el("div", "who", String(e.tool).replace(/_/g, " ")));
  box.append(el("div", null, e.text != null ? e.text : (e.out || "")));
  return box;
}

let idle = "Waiting for the first move…", following = true;
const feedEl = $("feed");
function updEmpty() {
  let em = $("empty");
  if (feedEl.querySelector(".e")) { em?.remove(); return; }
  if (!em) { em = el("div", "empty"); em.id = "empty"; feedEl.append(em); }
  em.textContent = idle;
}
function toBottom() { feedEl.scrollTop = feedEl.scrollHeight; following = true; $("jump").hidden = true; }
feedEl.addEventListener("scroll", () => {
  following = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 40;
  $("jump").hidden = following;
});
$("jump").onclick = toBottom;
// the feed box changes height (stats appear, plan folds, phone rotates): a follower stays glued to the newest entry
let lastH = feedEl.clientHeight;
new ResizeObserver(() => { const h = feedEl.clientHeight; if (h !== lastH) { lastH = h; if (following) feedEl.scrollTop = feedEl.scrollHeight; } }).observe(feedEl);

// Compact mode: persisted in localStorage (storage may throw: private mode, blocked cookies). Phones default to compact.
const mobileMQ = window.matchMedia("(max-width: 800px), (max-height: 500px) and (orientation: landscape)");
function storedCompact() { try { const v = localStorage.getItem("eu4watch.compact"); return v === "1" ? true : v === "0" ? false : null; } catch (e) { return null; } }
function applyCompact(on) {
  // keep the reader's place: follow the bottom if following, else pin the entry at the top of the viewport
  const top = feedEl.getBoundingClientRect().top;
  const anchor = following ? null : [...feedEl.children].find(c => c.getBoundingClientRect().bottom > top + 1);
  const off = anchor ? anchor.getBoundingClientRect().top - top : 0;
  document.body.classList.toggle("compact", on);
  $("compact").checked = on;
  if (following) feedEl.scrollTop = feedEl.scrollHeight;
  else if (anchor) feedEl.scrollTop += anchor.getBoundingClientRect().top - top - off;
}
$("compact").addEventListener("change", e => {
  applyCompact(e.target.checked);
  try { localStorage.setItem("eu4watch.compact", e.target.checked ? "1" : "0"); } catch (err) {}
});
{ const c = storedCompact(); applyCompact(c == null ? mobileMQ.matches : c); }

// Folds: Game stats / Plan / Rules. Desktop: independent <details> (stats and plan open by default). Phone: chips, one open at a time, all closed by default.
const FOLDS = ["statsd", "plan", "rules"];
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function syncChips() {
  for (const c of document.querySelectorAll(".chip")) {
    const d = $(c.dataset.fold);
    c.hidden = d.hidden;
    c.setAttribute("aria-expanded", String(d.open && !d.hidden));
  }
  $("chipsum").textContent = $("statsum").textContent;
}
function initFolds() {
  if (mobileMQ.matches) { const f = lsGet("eu4watch.fold"); for (const id of FOLDS) $(id).open = id === f; }
  else { $("statsd").open = lsGet("eu4watch.stats") !== "0"; $("plan").open = lsGet("eu4watch.plan") !== "0"; }
  syncChips();
}
for (const c of document.querySelectorAll(".chip")) c.addEventListener("click", () => {
  const id = c.dataset.fold, on = !$(id).open;
  for (const f of FOLDS) $(f).open = on && f === id;
  lsSet("eu4watch.fold", on ? id : ""); syncChips();
});
for (const [id, key] of [["statsd", "eu4watch.stats"], ["plan", "eu4watch.plan"]])
  $(id).addEventListener("toggle", () => { if (!mobileMQ.matches) lsSet(key, $(id).open ? "1" : "0"); });
mobileMQ.addEventListener?.("change", initFolds);
initFolds();

let feedBusy = false;  // one poll at a time: a backgrounded tab queues timer ticks, and overlapping fetches with the same "after" appended the same entries several times
async function pollFeed() {
  if (feedBusy) return;
  feedBusy = true;
  try { await pollFeedOnce(); } finally { feedBusy = false; }
}
async function pollFeedOnce() {
  try {
    const r = await (await fetch("/api/feed?after=" + next)).json();
    if (r.next < next) { next = 0; lastDate = null; feedEl.replaceChildren(); updEmpty(); return pollFeedOnce(); }  // journal was reset
    let added = false;
    for (const e of r.entries) {
      if (!SHOW.has(e.kind) || !e.text) continue;
      if (e.date && e.date !== lastDate) { feedEl.append(el("div", "day", gdate(e.date))); lastDate = e.date; }
      feedEl.append(render(e)); added = true;
    }
    next = r.next;
    if (added) {
      $("empty")?.remove();
      const items = feedEl.querySelectorAll(".e");
      for (let i = items.length - 300; i > 0; i--) feedEl.querySelector(".e").previousElementSibling?.remove?.(), feedEl.querySelector(".e").remove();
      while (feedEl.firstElementChild?.classList.contains("day") && feedEl.firstElementChild.nextElementSibling?.classList.contains("day")) feedEl.firstElementChild.remove();
      if (following) toBottom();
    }
  } catch (e) {}
}

startVideo().then(() => { pollState(); pollFeed(); });
setInterval(startVideo, 5000);
setInterval(pollState, 4000); setInterval(pollFeed, 2000);
</script>
